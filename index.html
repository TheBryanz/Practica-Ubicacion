<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificación de dispositivo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 20px;
            text-align: left;
            word-break: break-word;
        }

        .seccion {
            margin-top: 25px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .seccion h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .dato {
            margin: 8px 0;
        }

        .dato strong {
            display: inline-block;
            min-width: 125px;
        }

        .cargando {
            text-align: center;
            color: #555;
        }

        .mapa {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Verificación</h2>

    <p>
        C malicho pa mi.
    </p>

    <button onclick="obtenerInformacion()">
        Dale Continuar Pes
    </button>

    <div id="resultado"></div>

</div>


<script>

/* =========================================================
   FUNCIÓN PRINCIPAL
   ========================================================= */

async function obtenerInformacion() {

    const resultado = document.getElementById("resultado");

    resultado.innerHTML = `
        <div class="cargando">
            <p>Recopilando información...</p>
            <p>Espera unos segundos.</p>
        </div>
    `;

    try {

        // Obtener información del dispositivo
        const dispositivo = obtenerDispositivo();

        // Obtener información de IP
        const ipInfo = await obtenerIP();

        // Obtener ubicación GPS
        obtenerUbicacion(dispositivo, ipInfo);

    } catch (error) {

        console.error(error);

        resultado.innerHTML = `
            <p>
                Ocurrió un error al obtener la información.
            </p>
            <p>
                ${error.message}
            </p>
        `;
    }
}


/* =========================================================
   INFORMACIÓN DEL DISPOSITIVO
   ========================================================= */

function obtenerDispositivo() {

    const ua = navigator.userAgent;

    // Sistema operativo
    let os = detectarSistemaOperativo(ua);

    // Plataforma
    let plataforma = detectarPlataforma(ua);

    // CPU
    let cpuCores = navigator.hardwareConcurrency || "Not Available";

    // RAM
    // deviceMemory no está disponible en todos los navegadores
    let ram = navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "Not Available";

    // Resolución
    let resolucion =
        screen.width + "x" + screen.height;

    // Navegador
    let navegador = detectarNavegador(ua);

    // GPU
    let gpu = obtenerGPU();

    return {
        os: os,
        plataforma: plataforma,
        cpuCores: cpuCores,
        ram: ram,
        gpuVendor: gpu.vendor,
        gpu: gpu.renderer,
        resolucion: resolucion,
        navegador: navegador
    };
}


/* =========================================================
   SISTEMA OPERATIVO
   ========================================================= */

function detectarSistemaOperativo(ua) {

    if (/iPhone|iPad|iPod/i.test(ua)) {

        const match = ua.match(/OS ([0-9_]+)/i);

        if (match) {
            return "iPhone OS " + match[1];
        }

        return "iOS";
    }

    if (/Android/i.test(ua)) {

        const match = ua.match(/Android ([0-9.]+)/i);

        if (match) {
            return "Android " + match[1];
        }

        return "Android";
    }

    if (/Windows NT 10.0/i.test(ua)) {
        return "Windows 10/11";
    }

    if (/Windows NT 6.3/i.test(ua)) {
        return "Windows 8.1";
    }

    if (/Windows NT 6.2/i.test(ua)) {
        return "Windows 8";
    }

    if (/Windows NT 6.1/i.test(ua)) {
        return "Windows 7";
    }

    if (/Mac OS X/i.test(ua)) {

        const match = ua.match(/Mac OS X ([0-9_]+)/i);

        if (match) {
            return "macOS " + match[1].replace(/_/g, ".");
        }

        return "macOS";
    }

    if (/Linux/i.test(ua)) {
        return "Linux";
    }

    return "Not Available";
}


/* =========================================================
   PLATAFORMA
   ========================================================= */

function detectarPlataforma(ua) {

    if (/iPhone/i.test(ua)) {
        return "iPhone";
    }

    if (/iPad/i.test(ua)) {
        return "iPad";
    }

    if (/Android/i.test(ua)) {
        return "Android";
    }

    if (/Windows/i.test(ua)) {
        return "Windows";
    }

    if (/Macintosh|Mac OS/i.test(ua)) {
        return "Mac";
    }

    if (/Linux/i.test(ua)) {
        return "Linux";
    }

    return navigator.platform || "Not Available";
}


/* =========================================================
   NAVEGADOR
   ========================================================= */

function detectarNavegador(ua) {

    if (/CriOS/i.test(ua)) {
        return "Chrome iOS";
    }

    if (/FxiOS/i.test(ua)) {
        return "Firefox iOS";
    }

    if (/EdgiOS/i.test(ua)) {
        return "Edge iOS";
    }

    if (/OPiOS/i.test(ua)) {
        return "Opera iOS";
    }

    if (/Chrome/i.test(ua)) {
        return "Google Chrome";
    }

    if (/Firefox/i.test(ua)) {
        return "Mozilla Firefox";
    }

    if (/Edg/i.test(ua)) {
        return "Microsoft Edge";
    }

    if (/OPR/i.test(ua)) {
        return "Opera";
    }

    if (/Safari/i.test(ua)) {
        const match = ua.match(/Version\/([0-9.]+)/i);

        if (match) {
            return "Safari/" + match[1];
        }

        return "Safari";
    }

    return "Not Available";
}


/* =========================================================
   GPU / WEBGL
   ========================================================= */

function obtenerGPU() {

    try {

        const canvas = document.createElement("canvas");

        const gl =
            canvas.getContext("webgl") ||
            canvas.getContext("experimental-webgl");

        if (!gl) {

            return {
                vendor: "Not Available",
                renderer: "Not Available"
            };
        }

        const debugInfo =
            gl.getExtension("WEBGL_debug_renderer_info");

        if (debugInfo) {

            const vendor = gl.getParameter(
                debugInfo.UNMASKED_VENDOR_WEBGL
            );

            const renderer = gl.getParameter(
                debugInfo.UNMASKED_RENDERER_WEBGL
            );

            return {
                vendor: vendor || "Not Available",
                renderer: renderer || "Not Available"
            };
        }

        return {
            vendor: gl.getParameter(gl.VENDOR) || "Not Available",
            renderer: gl.getParameter(gl.RENDERER) || "Not Available"
        };

    } catch (error) {

        return {
            vendor: "Not Available",
            renderer: "Not Available"
        };
    }
}


/* =========================================================
   IP PÚBLICA + INFORMACIÓN GEOIP
   ========================================================= */

async function obtenerIP() {

    const respuesta = await fetch(
        "https://ipapi.co/json/"
    );

    if (!respuesta.ok) {
        throw new Error("No se pudo obtener la información de IP.");
    }

    const data = await respuesta.json();

    return {

        ip: data.ip || "Not Available",

        continent:
            data.continent_name || "Not Available",

        country:
            data.country_name || "Not Available",

        region:
            data.region || "Not Available",

        city:
            data.city || "Not Available",

        org:
            data.org || "Not Available",

        isp:
            data.org || "Not Available"
    };
}


/* =========================================================
   GEOLOCALIZACIÓN GPS
   ========================================================= */

function obtenerUbicacion(dispositivo, ipInfo) {

    const resultado = document.getElementById("resultado");

    if (!navigator.geolocation) {

        mostrarResultado(
            dispositivo,
            ipInfo,
            null,
            "Este navegador no permite geolocalización."
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(posicion) {

            const ubicacion = {

                latitud:
                    posicion.coords.latitude,

                longitud:
                    posicion.coords.longitude,

                precision:
                    posicion.coords.accuracy
            };

            mostrarResultado(
                dispositivo,
                ipInfo,
                ubicacion,
                null
            );
        },

        function(error) {

            let mensaje;

            if (error.code === 1) {

                mensaje =
                    "El usuario rechazó el permiso de ubicación.";

            } else if (error.code === 2) {

                mensaje =
                    "No se pudo determinar la ubicación.";

            } else if (error.code === 3) {

                mensaje =
                    "La solicitud de ubicación tardó demasiado.";

            } else {

                mensaje =
                    "Ocurrió un error desconocido.";
            }

            mostrarResultado(
                dispositivo,
                ipInfo,
                null,
                mensaje
            );
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}


/* =========================================================
   MOSTRAR RESULTADO
   ========================================================= */

function mostrarResultado(
    dispositivo,
    ipInfo,
    ubicacion,
    errorUbicacion
) {

    const resultado =
        document.getElementById("resultado");

    let html = `

        <div class="seccion">

            <h3>[!] Device Information</h3>

            <div class="dato">
                <strong>[+] OS:</strong>
                ${dispositivo.os}
            </div>

            <div class="dato">
                <strong>[+] Platform:</strong>
                ${dispositivo.plataforma}
            </div>

            <div class="dato">
                <strong>[+] CPU Cores:</strong>
                ${dispositivo.cpuCores}
            </div>

            <div class="dato">
                <strong>[+] RAM:</strong>
                ${dispositivo.ram}
            </div>

            <div class="dato">
                <strong>[+] GPU Vendor:</strong>
                ${dispositivo.gpuVendor}
            </div>

            <div class="dato">
                <strong>[+] GPU:</strong>
                ${dispositivo.gpu}
            </div>

            <div class="dato">
                <strong>[+] Resolution:</strong>
                ${dispositivo.resolucion}
            </div>

            <div class="dato">
                <strong>[+] Browser:</strong>
                ${dispositivo.navegador}
            </div>

            <div class="dato">
                <strong>[+] Public IP:</strong>
                ${ipInfo.ip}
            </div>

        </div>


        <div class="seccion">

            <h3>[!] IP Information</h3>

            <div class="dato">
                <strong>[+] Continent:</strong>
                ${ipInfo.continent}
            </div>

            <div class="dato">
                <strong>[+] Country:</strong>
                ${ipInfo.country}
            </div>

            <div class="dato">
                <strong>[+] Region:</strong>
                ${ipInfo.region}
            </div>

            <div class="dato">
                <strong>[+] City:</strong>
                ${ipInfo.city}
            </div>

            <div class="dato">
                <strong>[+] Org:</strong>
                ${ipInfo.org}
            </div>

            <div class="dato">
                <strong>[+] ISP:</strong>
                ${ipInfo.isp}
            </div>

        </div>
    `;


    /* =====================================================
       UBICACIÓN
       ===================================================== */

    if (ubicacion) {

        html += `

            <div class="seccion">

                <h3>[!] Location Information</h3>

                <div class="dato">
                    <strong>[+] Latitude:</strong>
                    ${ubicacion.latitud}
                </div>

                <div class="dato">
                    <strong>[+] Longitude:</strong>
                    ${ubicacion.longitud}
                </div>

                <div class="dato">
                    <strong>[+] Accuracy:</strong>
                    ${Math.round(ubicacion.precision)} meters
                </div>

                <a
                    class="mapa"
                    href="https://www.google.com/maps?q=${ubicacion.latitud},${ubicacion.longitud}"
                    target="_blank"
                    rel="noopener noreferrer">

                    Ver ubicación en Google Maps

                </a>

            </div>
        `;

    } else {

        html += `

            <div class="seccion">

                <h3>[!] Location</h3>

                <p>
                    ${errorUbicacion}
                </p>

            </div>
        `;
    }


    resultado.innerHTML = html;
}

</script>

</body>
</html>
