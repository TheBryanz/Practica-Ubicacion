<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de ubicación</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 20px;
            text-align: left;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Verificación</h2>

    <p>
        Para realizar esta prueba necesitamos comprobar la ubicación
        de este dispositivo, 
        psdt.... Aun esta en desarrollo xdd
        C malicho pa mi.
    </p>

    <button onclick="obtenerUbicacion()">
        Continuar
    </button>

    <div id="resultado"></div>

</div>

<script>

function obtenerUbicacion() {

    const resultado = document.getElementById("resultado");

    if (!navigator.geolocation) {
        resultado.innerHTML = "Este navegador no permite geolocalización.";
        return;
    }

    resultado.innerHTML = "Solicitando permiso...";

    navigator.geolocation.getCurrentPosition(

        function(posicion) {

            const latitud = posicion.coords.latitude;
            const longitud = posicion.coords.longitude;
            const precision = posicion.coords.accuracy;

            resultado.innerHTML = `
                <h3>Ubicación obtenida</h3>

                <p>
                    <strong>Latitud:</strong> ${latitud}
                </p>

                <p>
                    <strong>Longitud:</strong> ${longitud}
                </p>

                <p>
                    <strong>Precisión aproximada:</strong>
                    ${Math.round(precision)} metros
                </p>

                <p>
                    <a
                        href="https://www.google.com/maps?q=${latitud},${longitud}"
                        target="_blank">
                        Ver ubicación en Google Maps
                    </a>
                </p>
            `;
        },

        function(error) {

            if (error.code === 1) {
                resultado.innerHTML =
                    "El usuario rechazó el permiso de ubicación.";
            }

            else if (error.code === 2) {
                resultado.innerHTML =
                    "No se pudo determinar la ubicación.";
            }

            else if (error.code === 3) {
                resultado.innerHTML =
                    "La solicitud de ubicación tardó demasiado.";
            }

            else {
                resultado.innerHTML =
                    "Ocurrió un error desconocido.";
            }
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

</script>

</body>
</html>
