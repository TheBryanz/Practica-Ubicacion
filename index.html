<body>

<script>


/* =========================================================
   FUNCIÓN PRINCIPAL
   ========================================================= */

async function iniciarEscaneo() {

    const resultado =
        document.getElementById("resultado");

    const boton =
        document.getElementById("btn");

    boton.disabled = true;

    boton.textContent =
        "Recopilando información...";

    resultado.innerHTML = `

        <div class="loading">

            <p>
                Analizando dispositivo...
            </p>

            <p>
                Obteniendo información de red...
            </p>

        </div>

    `;


    try {

        /*
         * Información local
         */

        const dispositivo =
            obtenerInformacionDispositivo();


        /*
         * Información IP
         */

        const ipInfo =
            await obtenerInformacionIP();


        /*
         * Mostrar información inicial
         */

        mostrarInformacion(
            dispositivo,
            ipInfo,
            null,
            "Solicitando ubicación..."
        );


        /*
         * Solicitar GPS
         */

        obtenerUbicacion(
            dispositivo,
            ipInfo
        );


    } catch (error) {

        console.error(error);

        resultado.innerHTML = `

            <div class="seccion">

                <h3>[!] Error</h3>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;
    }

    finally {

        boton.disabled = false;

        boton.textContent =
            "Volver a escanear";
    }
}


/* =========================================================
   INFORMACIÓN DEL DISPOSITIVO
   ========================================================= */

function obtenerInformacionDispositivo() {

    const ua =
        navigator.userAgent || "";


    return {

        /*
         * Sistema operativo
         */

        os:
            detectarSistemaOperativo(ua),


        /*
         * Plataforma
         */

        platform:
            detectarPlataforma(ua),


        /*
         * Tipo de dispositivo
         */

        deviceType:
            detectarTipoDispositivo(),


        /*
         * CPU
         */

        cpuCores:
            navigator.hardwareConcurrency
            || "Not Available",


        /*
         * RAM
         */

        ram:
            navigator.deviceMemory
            ? navigator.deviceMemory + " GB"
            : "Not Available",


        /*
         * Arquitectura
         */

        architecture:
            obtenerArquitectura(),


        /*
         * Touch
         */

        touch:
            navigator.maxTouchPoints > 0
            ? "Yes"
            : "No",


        maxTouchPoints:
            navigator.maxTouchPoints
            || 0,


        /*
         * Resolución
         */

        resolution:
            screen.width +
            "x" +
            screen.height,


        /*
         * Resolución física aproximada
         */

        physicalResolution:
            Math.round(
                screen.width *
                window.devicePixelRatio
            )
            +
            "x"
            +
            Math.round(
                screen.height *
                window.devicePixelRatio
            ),


        /*
         * Pixel ratio
         */

        pixelRatio:
            window.devicePixelRatio
            || 1,


        /*
         * Área disponible
         */

        availableResolution:
            screen.availWidth +
            "x" +
            screen.availHeight,


        /*
         * Orientación
         */

        orientation:
            obtenerOrientacion(),


        /*
         * Idioma
         */

        language:
            navigator.language
            || "Not Available",


        languages:
            navigator.languages
            ? navigator.languages.join(", ")
            : "Not Available",


        /*
         * Zona horaria
         */

        timezone:
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone
            || "Not Available",


        /*
         * Online
         */

        online:
            navigator.onLine
            ? "Yes"
            : "No",


        /*
         * Cookies
         */

        cookies:
            navigator.cookieEnabled
            ? "Enabled"
            : "Disabled",


        /*
         * Do Not Track
         */

        doNotTrack:
            navigator.doNotTrack
            || "Not Available",


        /*
         * Navegador
         */

        browser:
            detectarNavegador(ua),


        /*
         * User Agent
         */

        userAgent:
            ua,


        /*
         * GPU
         */

        gpu:
            obtenerGPU(),


        /*
         * WebGL
         */

        webgl:
            obtenerWebGL(),


        /*
         * Capacidades
         */

        capabilities:
            obtenerCapacidades()
    };
}


/* =========================================================
   SISTEMA OPERATIVO
   ========================================================= */

function detectarSistemaOperativo(ua) {

    if (/iPhone|iPad|iPod/i.test(ua)) {

        const match =
            ua.match(/OS ([0-9_]+)/i);

        if (match) {

            return "iPhone OS " +
                match[1].replace(/_/g, ".");
        }

        return "iOS";
    }


    if (/Android/i.test(ua)) {

        const match =
            ua.match(/Android ([0-9.]+)/i);

        if (match) {

            return "Android " +
                match[1];
        }

        return "Android";
    }


    if (/Windows NT 10.0/i.test(ua)) {

        return "Windows 10/11";
    }


    if (/Windows NT 6.3/i.test(ua)) {

        return "Windows 8.1";
    }


    if (/Windows NT 6.2/i.test(ua)) {

        return "Windows 8";
    }


    if (/Windows NT 6.1/i.test(ua)) {

        return "Windows 7";
    }


    if (/Mac OS X/i.test(ua)) {

        const match =
            ua.match(/Mac OS X ([0-9_]+)/i);

        if (match) {

            return "macOS " +
                match[1].replace(/_/g, ".");
        }

        return "macOS";
    }


    if (/Linux/i.test(ua)) {

        return "Linux";
    }


    return "Not Available";
}


/* =========================================================
   PLATAFORMA
   ========================================================= */

function detectarPlataforma(ua) {

    if (/iPhone/i.test(ua)) {

        return "iPhone";
    }

    if (/iPad/i.test(ua)) {

        return "iPad";
    }

    if (/Android/i.test(ua)) {

        return "Android";
    }

    if (/Windows/i.test(ua)) {

        return "Windows";
    }

    if (/Macintosh|Mac OS/i.test(ua)) {

        return "Mac";
    }

    if (/Linux/i.test(ua)) {

        return "Linux";
    }

    return navigator.platform ||
        "Not Available";
}


/* =========================================================
   TIPO DE DISPOSITIVO
   ========================================================= */

function detectarTipoDispositivo() {

    const ua =
        navigator.userAgent.toLowerCase();


    if (/ipad|tablet/i.test(ua)) {

        return "Tablet";
    }


    if (/iphone|ipod|android.*mobile/i.test(ua)) {

        return "Mobile";
    }


    return "Desktop";
}


/* =========================================================
   ARQUITECTURA
   ========================================================= */

function obtenerArquitectura() {

    if (navigator.userAgentData &&
        navigator.userAgentData.architecture) {

        return navigator.userAgentData.architecture;
    }


    const ua =
        navigator.userAgent;


    if (/arm64|aarch64/i.test(ua)) {

        return "ARM64";
    }


    if (/arm/i.test(ua)) {

        return "ARM";
    }


    if (/x86_64|Win64|x64|amd64/i.test(ua)) {

        return "x64";
    }


    if (/x86/i.test(ua)) {

        return "x86";
    }


    return "Not Available";
}


/* =========================================================
   ORIENTACIÓN
   ========================================================= */

function obtenerOrientacion() {

    if (screen.orientation) {

        return screen.orientation.type;
    }


    if (window.innerWidth >
        window.innerHeight) {

        return "Landscape";
    }


    return "Portrait";
}


/* =========================================================
   NAVEGADOR
   ========================================================= */

function detectarNavegador(ua) {

    let match;


    if (/CriOS/i.test(ua)) {

        match =
            ua.match(/CriOS\/([0-9.]+)/i);

        return match
            ? "Chrome iOS " + match[1]
            : "Chrome iOS";
    }


    if (/FxiOS/i.test(ua)) {

        match =
            ua.match(/FxiOS\/([0-9.]+)/i);

        return match
            ? "Firefox iOS " + match[1]
            : "Firefox iOS";
    }


    if (/EdgiOS/i.test(ua)) {

        match =
            ua.match(/EdgiOS\/([0-9.]+)/i);

        return match
            ? "Edge iOS " + match[1]
            : "Edge iOS";
    }


    if (/Chrome/i.test(ua)) {

        match =
            ua.match(/Chrome\/([0-9.]+)/i);

        return match
            ? "Google Chrome " + match[1]
            : "Google Chrome";
    }


    if (/Firefox/i.test(ua)) {

        match =
            ua.match(/Firefox\/([0-9.]+)/i);

        return match
            ? "Mozilla Firefox " + match[1]
            : "Mozilla Firefox";
    }


    if (/Edg/i.test(ua)) {

        match =
            ua.match(/Edg\/([0-9.]+)/i);

        return match
            ? "Microsoft Edge " + match[1]
            : "Microsoft Edge";
    }


    if (/OPR/i.test(ua)) {

        match =
            ua.match(/OPR\/([0-9.]+)/i);

        return match
            ? "Opera " + match[1]
            : "Opera";
    }


    if (/Safari/i.test(ua)) {

        match =
            ua.match(/Version\/([0-9.]+)/i);

        return match
            ? "Safari " + match[1]
            : "Safari";
    }


    return "Not Available";
}


/* =========================================================
   GPU
   ========================================================= */

function obtenerGPU() {

    try {

        const canvas =
            document.createElement("canvas");


        const gl =
            canvas.getContext("webgl") ||
            canvas.getContext(
                "experimental-webgl"
            );


        if (!gl) {

            return {

                vendor:
                    "Not Available",

                renderer:
                    "Not Available"
            };
        }


        const debugInfo =
            gl.getExtension(
                "WEBGL_debug_renderer_info"
            );


        if (debugInfo) {

            const vendor =
                gl.getParameter(
                    debugInfo.UNMASKED_VENDOR_WEBGL
                );


            const renderer =
                gl.getParameter(
                    debugInfo.UNMASKED_RENDERER_WEBGL
                );


            return {

                vendor:
                    vendor ||
                    "Not Available",

                renderer:
                    renderer ||
                    "Not Available"
            };
        }


        return {

            vendor:
                gl.getParameter(
                    gl.VENDOR
                ) ||
                "Not Available",

            renderer:
                gl.getParameter(
                    gl.RENDERER
                ) ||
                "Not Available"
        };


    } catch (error) {

        return {

            vendor:
                "Not Available",

            renderer:
                "Not Available"
        };
    }
}


/* =========================================================
   WEBGL
   ========================================================= */

function obtenerWebGL() {

    const resultado = {

        webgl:
            "Not Available",

        webgl2:
            "Not Available",

        version:
            "Not Available",

        shadingLanguage:
            "Not Available",

        maxTextureSize:
            "Not Available",

        maxViewport:
            "Not Available"
    };


    try {

        const canvas =
            document.createElement("canvas");


        const gl =
            canvas.getContext("webgl");


        if (gl) {

            resultado.webgl =
                "Supported";

            resultado.version =
                gl.getParameter(
                    gl.VERSION
                );

            resultado.shadingLanguage =
                gl.getParameter(
                    gl.SHADING_LANGUAGE_VERSION
                );

            resultado.maxTextureSize =
                gl.getParameter(
                    gl.MAX_TEXTURE_SIZE
                );

            const viewport =
                gl.getParameter(
                    gl.MAX_VIEWPORT_DIMS
                );

            resultado.maxViewport =
                viewport[0] +
                "x" +
                viewport[1];
        }


        const gl2 =
            canvas.getContext("webgl2");


        if (gl2) {

            resultado.webgl2 =
                "Supported";
        }


    } catch (error) {

        console.log(
            "WebGL error:",
            error
        );
    }


    return resultado;
}


/* =========================================================
   CAPACIDADES DEL NAVEGADOR
   ========================================================= */

function obtenerCapacidades() {

    return {

        geolocation:
            "geolocation" in navigator,

        camera:
            !!(
                navigator.mediaDevices &&
                navigator.mediaDevices.getUserMedia
            ),

        microphone:
            !!(
                navigator.mediaDevices &&
                navigator.mediaDevices.getUserMedia
            ),

        bluetooth:
            "bluetooth" in navigator,

        usb:
            "usb" in navigator,

        nfc:
            "NDEFReader" in window,

        vibration:
            "vibrate" in navigator,

        gamepad:
            "getGamepads" in navigator,

        serviceWorker:
            "serviceWorker" in navigator,

        webAssembly:
            typeof WebAssembly !==
            "undefined",

        webRTC:
            !!(
                window.RTCPeerConnection
            ),

        clipboard:
            !!(
                navigator.clipboard
            ),

        wakeLock:
            "wakeLock" in navigator,

        cookies:
            navigator.cookieEnabled,

        localStorage:
            comprobarLocalStorage(),

        sessionStorage:
            comprobarSessionStorage()
    };
}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function comprobarLocalStorage() {

    try {

        return typeof localStorage !==
            "undefined";

    } catch {

        return false;
    }
}


/* =========================================================
   SESSION STORAGE
   ========================================================= */

function comprobarSessionStorage() {

    try {

        return typeof sessionStorage !==
            "undefined";

    } catch {

        return false;
    }
}


/* =========================================================
   INFORMACIÓN DE IP
   ========================================================= */

async function obtenerInformacionIP() {

    const respuesta =
        await fetch(
            "https://ipapi.co/json/"
        );


    if (!respuesta.ok) {

        throw new Error(
            "No se pudo obtener la información de IP."
        );
    }


    const data =
        await respuesta.json();


    return {

        ip:
            data.ip ||
            "Not Available",


        continent:
            data.continent_name ||
            "Not Available",


        country:
            data.country_name ||
            "Not Available",


        countryCode:
            data.country_code ||
            "Not Available",


        region:
            data.region ||
            "Not Available",


        city:
            data.city ||
            "Not Available",


        postal:
            data.postal ||
            "Not Available",


        latitude:
            data.latitude ||
            "Not Available",


        longitude:
            data.longitude ||
            "Not Available",


        timezone:
            data.timezone ||
            "Not Available",


        org:
            data.org ||
            "Not Available",


        asn:
            data.asn ||
            "Not Available",


        hostname:
            data.hostname ||
            "Not Available"
    };
}


/* =========================================================
   GEOLOCALIZACIÓN
   ========================================================= */

function obtenerUbicacion(
    dispositivo,
    ipInfo
) {

    if (!navigator.geolocation) {

        mostrarInformacion(

            dispositivo,

            ipInfo,

            null,

            "Geolocation no está disponible."
        );

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(posicion) {

            const coords =
                posicion.coords;


            const ubicacion = {

                latitude:
                    coords.latitude,

                longitude:
                    coords.longitude,

                accuracy:
                    coords.accuracy,

                altitude:
                    coords.altitude,

                altitudeAccuracy:
                    coords.altitudeAccuracy,

                heading:
                    coords.heading,

                speed:
                    coords.speed,

                timestamp:
                    posicion.timestamp
            };


            mostrarInformacion(

                dispositivo,

                ipInfo,

                ubicacion,

                null
            );
        },


        function(error) {

            let mensaje;


            if (error.code === 1) {

                mensaje =
                    "Permiso de ubicación rechazado.";

            }

            else if (error.code === 2) {

                mensaje =
                    "No se pudo determinar la ubicación.";

            }

            else if (error.code === 3) {

                mensaje =
                    "La solicitud de ubicación tardó demasiado.";

            }

            else {

                mensaje =
                    "Error desconocido.";
            }


            mostrarInformacion(

                dispositivo,

                ipInfo,

                null,

                mensaje
            );
        },


        {

            enableHighAccuracy:
                true,

            timeout:
                15000,

            maximumAge:
                0
        }
    );
}


/* =========================================================
   MOSTRAR INFORMACIÓN
   ========================================================= */

function mostrarInformacion(

    dispositivo,

    ipInfo,

    ubicacion,

    errorUbicacion

) {

    const resultado =
        document.getElementById(
            "resultado"
        );


    let html = "";


    /* =====================================================
       DEVICE
       ===================================================== */

    html += `

        <div class="seccion">

            <h3>
                [!] Device Information
            </h3>

            ${dato(
                "OS",
                dispositivo.os
            )}

            ${dato(
                "Platform",
                dispositivo.platform
            )}

            ${dato(
                "Device Type",
                dispositivo.deviceType
            )}

            ${dato(
                "CPU Cores",
                dispositivo.cpuCores
            )}

            ${dato(
                "RAM",
                dispositivo.ram
            )}

            ${dato(
                "Architecture",
                dispositivo.architecture
            )}

            ${dato(
                "Touch Support",
                dispositivo.touch
            )}

            ${dato(
                "Max Touch Points",
                dispositivo.maxTouchPoints
            )}

        </div>

    `;


    /* =====================================================
       DISPLAY
       ===================================================== */

    html += `

        <div class="seccion">

            <h3>
                [!] Display Information
            </h3>

            ${dato(
                "Resolution",
                dispositivo.resolution
            )}

            ${dato(
                "Physical Approx.",
                dispositivo.physicalResolution
            )}

            ${dato(
                "Available",
                dispositivo.availableResolution
            )}

            ${dato(
                "Pixel Ratio",
                dispositivo.pixelRatio
            )}

            ${dato(
                "Orientation",
                dispositivo.orientation
            )}

        </div>

    `;


    /* =====================================================
       BROWSER
       ===================================================== */

    html += `

        <div class="seccion">

            <h3>
                [!] Browser Information
            </h3>

            ${dato(
                "Browser",
                dispositivo.browser
            )}

            ${dato(
                "Language",
                dispositivo.language
            )}

            ${dato(
                "Languages",
                dispositivo.languages
            )}

            ${dato(
                "Timezone",
                dispositivo.timezone
            )}

            ${dato(
                "Online",
                dispositivo.online
            )}

            ${dato(
                "Cookies",
                dispositivo.cookies
            )}

            ${dato(
                "Do Not Track",
                dispositivo.doNotTrack
            )}

        </div>

    `;


    /* =====================================================
       GPU
       ===================================================== */

    html += `

        <div class="seccion">

            <h3>
                [!] GPU / Graphics
            </h3>

            ${dato(
                "GPU Vendor",
                dispositivo.gpu.vendor
            )}

            ${dato(
                "GPU Renderer",
                dispositivo.gpu.renderer
            )}

            ${dato(
                "WebGL",
                dispositivo.webgl.webgl
            )}

            ${dato(
                "WebGL2",
                dispositivo.webgl.webgl2
            )}

            ${dato(
                "WebGL Version",
                dispositivo.webgl.version
            )}

            ${dato(
                "GLSL",
                dispositivo.webgl.shadingLanguage
            )}

            ${dato(
                "Max Texture",
                dispositivo.webgl.maxTextureSize
            )}

            ${dato(
                "Max Viewport",
                dispositivo.webgl.maxViewport
            )}

        </div>

    `;

/* =========================================================
   CREAR DATO
   ========================================================= */

function dato(nombre, valor) {

    return `

        <div class="dato">

            <strong>
                [+] ${escapeHTML(nombre)}:
            </strong>

            <span class="valor">

                ${escapeHTML(
                    String(
                        valor ??
                        "Not Available"
                    )
                )}

            </span>

        </div>

    `;
}


/* =========================================================
   CREAR CAPACIDAD
   ========================================================= */

function capacidad(nombre, disponible) {

    const texto =
        disponible
        ? "Available"
        : "Not Available";


    const clase =
        disponible
        ? "ok"
        : "no";


    return `

        <div class="dato">

            <strong>
                [+] ${escapeHTML(nombre)}:
            </strong>

            <span class="${clase}">

                ${texto}

            </span>

        </div>

    `;
}


/* =========================================================
   PROTECCIÓN HTML
   ========================================================= */

function escapeHTML(valor) {

    return String(valor)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}
